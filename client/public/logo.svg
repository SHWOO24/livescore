<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon circle background -->
  <circle cx="100" cy="100" r="80" fill="url(#logoGradient)" />
  
  <!-- Sports icons in circle -->
  <!-- Soccer ball -->
  <g transform="translate(100, 100)">
    <circle cx="-25" cy="-25" r="18" fill="#ffffff" opacity="0.9"/>
    <path d="M-35,-30 L-20,-40 M20,-40 L35,-30 M35,-30 L20,-10 M-20,-10 L-35,-30 M-20,-10 L-5,5 M-5,5 L20,-10 M-20,-10 L-5,-20 M-5,-20 L20,-10" 
          stroke="#0ea5e9" stroke-width="1.5" fill="none"/>
    
    <!-- Basketball -->
    <circle cx="25" cy="-25" r="18" fill="#f97316" opacity="0.9"/>
    <path d="M10,-35 L35,-10 M35,-35 L10,-10" stroke="#ffffff" stroke-width="2"/>
    <circle cx="25" cy="-25" r="6" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Baseball -->
    <circle cx="-25" cy="25" r="18" fill="#ffffff" opacity="0.9"/>
    <path d="M-35,15 Q-25,5 -15,15 Q-25,25 -35,15" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    
    <!-- Volleyball -->
    <circle cx="25" cy="25" r="18" fill="#10b981" opacity="0.9"/>
    <path d="M10,15 L25,10 L40,15 M10,15 L15,25 L10,35 M40,15 L35,25 L40,35 M25,10 L25,35" 
          stroke="#ffffff" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Text -->
  <text x="220" y="120" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#textGradient)">|t�T�</text>
  <text x="220" y="160" font-family="Arial, sans-serif" font-size="32" fill="#64748b">LiveScore</text>
</svg>
