<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="ballShine">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.2" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#iconGradient)" />
  
  <!-- Main soccer ball with motion lines -->
  <g transform="translate(256, 256)">
    <!-- Motion lines -->
    <line x1="80" y1="0" x2="120" y2="0" stroke="#ffffff" stroke-width="8" stroke-opacity="0.6" stroke-linecap="round"/>
    <line x1="90" y1="-15" x2="125" y2="-20" stroke="#ffffff" stroke-width="6" stroke-opacity="0.5" stroke-linecap="round"/>
    <line x1="90" y1="15" x2="125" y2="20" stroke="#ffffff" stroke-width="6" stroke-opacity="0.5" stroke-linecap="round"/>
    
    <!-- Soccer ball -->
    <circle cx="0" cy="0" r="100" fill="#ffffff" stroke="#1e40af" stroke-width="4"/>
    <circle cx="0" cy="0" r="100" fill="url(#ballShine)"/>
    
    <!-- Soccer ball pattern -->
    <path d="M-70,-40 L-40,-70 M40,-70 L70,-40 M70,-40 L40,-10 M-40,-10 L-70,-40 M-40,-10 L-10,20 M-10,20 L40,-10 M-40,-10 L-10,-20 M-10,-20 L40,-10 M-70,40 L-40,70 M40,70 L70,40 M70,40 L40,10 M-40,10 L-70,40 M-40,10 L-10,-20 M-10,-20 L40,10 M-40,10 L-10,20 M-10,20 L40,10" 
          stroke="#1e40af" stroke-width="4" fill="none"/>
    
    <!-- Center pentagon -->
    <path d="M0,-30 L28,-9 L17,24 L-17,24 L-28,-9 Z" fill="#1e40af"/>
  </g>
  
  <!-- Small sports icons around -->
  <circle cx="120" cy="120" r="25" fill="#f97316" opacity="0.8"/>
  <path d="M105,105 L135,135 M135,105 L105,135" stroke="#ffffff" stroke-width="3"/>
  
  <circle cx="392" cy="120" r="25" fill="#10b981" opacity="0.8"/>
  <path d="M377,105 L392,120 L407,105 M377,135 L392,120 L407,135 M377,105 L382,120 L377,135 M407,105 L402,120 L407,135 M392,105 L392,135" 
        stroke="#ffffff" stroke-width="2" fill="none"/>
  
  <circle cx="120" cy="392" r="25" fill="#dc2626" opacity="0.8"/>
  <path d="M105,377 Q120,367 135,377 Q120,387 105,377" fill="none" stroke="#ffffff" stroke-width="2"/>
</svg>
