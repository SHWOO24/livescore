<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ballGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" />
  
  <!-- Soccer ball (top-left) -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="0" r="45" fill="url(#ballGradient)" stroke="#1e40af" stroke-width="2"/>
    <path d="M-30,-15 L-15,-30 M15,-30 L30,-15 M30,-15 L15,0 M-15,0 L-30,-15 M-15,0 L0,15 M0,15 L15,0 M-15,0 L0,-15 M0,-15 L15,0" 
          stroke="#1e40af" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Basketball (top-right) -->
  <g transform="translate(392, 120)">
    <circle cx="0" cy="0" r="45" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
    <path d="M-30,-30 L30,30 M30,-30 L-30,30" stroke="#ffffff" stroke-width="3"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>
  
  <!-- Baseball (bottom-left) -->
  <g transform="translate(120, 392)">
    <circle cx="0" cy="0" r="45" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <path d="M-45,0 Q0,-20 45,0 Q0,20 -45,0" fill="none" stroke="#dc2626" stroke-width="2"/>
    <path d="M-20,-20 L20,20 M20,-20 L-20,20" stroke="#dc2626" stroke-width="1"/>
  </g>
  
  <!-- Volleyball (bottom-right) -->
  <g transform="translate(392, 392)">
    <circle cx="0" cy="0" r="45" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <path d="M-30,-20 L0,-30 L30,-20 M-30,20 L0,30 L30,20 M-30,-20 L-20,0 L-30,20 M30,-20 L20,0 L30,20 M0,-30 L0,30" 
          stroke="#ffffff" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Center text/icon -->
  <text x="256" y="280" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" text-anchor="middle">LS</text>
</svg>
